<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline File Converter — 100% Private & Local</title>
  <meta name="description" content="Fast, private, and 100% offline file converter. Convert images, documents, audio, and video directly inside your browser without uploading to any server." />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app" class="app-container">
    <header class="app-header">
      <div class="header-brand">
        <div class="logo-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M12 18v-6"/>
            <path d="m9 15 3 3 3-3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="app-title">Offline File Converter</h1>
          <span class="privacy-badge" title="No files are ever sent to an external server">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            100% Local &amp; Offline
          </span>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-icon" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- File Drop Zone -->
      <section class="dropzone-section" aria-labelledby="dropzone-heading">
        <h2 id="dropzone-heading" class="sr-only">Upload Files</h2>
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-describedby="dropzone-desc">
          <input type="file" id="file-input" class="file-input" multiple />
          <div class="drop-zone-content">
            <div class="drop-zone-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p class="drop-zone-text">
              <strong>Drag &amp; drop files here</strong> or <span class="browse-link">browse your device</span>
            </p>
            <p id="dropzone-desc" class="drop-zone-hint">
              Images, Documents, Audio, and Video files processed 100% locally.
            </p>
          </div>
        </div>
      </section>

      <!-- Queue and Conversion Panel -->
      <section id="queue-section" class="queue-section hidden" aria-labelledby="queue-heading">
        <div class="queue-header">
          <h2 id="queue-heading" class="section-title">Conversion Queue (<span id="queue-count">0</span>)</h2>
          <div class="queue-actions">
            <button id="convert-all-btn" class="btn btn-primary" disabled>
              Convert All
            </button>
            <button id="download-all-btn" class="btn btn-secondary" disabled>
              Download All
            </button>
            <button id="clear-all-btn" class="btn btn-outline">
              Clear All
            </button>
          </div>
        </div>

        <ul id="file-queue-list" class="queue-list" role="list">
          <!-- Queue items rendered dynamically -->
        </ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>
        Offline File Converter &bull; Zero Server Communication &bull; Local Browser Execution
      </p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
